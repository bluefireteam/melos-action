name: Melos action
description: Setup Melos for you GitHub workflow
author: Lukas Klingsbo
branding:
  icon: loader
  color: purple
inputs:
  melos-version:
    description: 'The Melos version to make available on the path'
    required: false
  dart-version:
    description: >-
      The dart version to pass to dart-lang/setup-dart action used for
      publishing, this helps to avoid race condition when having flutter SDK
      setup with the version different from the latest dart.
      If 'none' is passed in, the action doesn't set up the dart version at
      all.
    required: false
    default: 'stable'
  run-bootstrap:
    description: 'Whether bootstrap should run or not (default: true)'
    required: false
    default: 'true'
  bootstrap-no-example:
    description: >-
      Whether to pass the --no-example flag to melos bootstrap, this helps to
      avoid race conditions in flutter packages, where pub get can be executed
      on the example project before melos has had a chance to generate its
      pubspec_overrides.yaml (default: false)
    required: false
    default: 'false'
  enforce-lockfile:
    description: 'Whether the versions in the lockfiles should be enforced (default: false)'
    required: false
    default: 'false'
  run-versioning:
    description: 'Whether packages should be versioned (default: false)'
    required: false
    default: 'false'
  run-versioning-prerelease:
    description: 'Whether packages should be versioned as a prerelease (default: false)'
    required: false
    default: 'false'
  run-versioning-graduate:
    description: 'Whether packages should be versioned with graduating prereleases to stable (default: false)'
    required: false
    default: 'false'
  include-private:
    description: 'Whether to include or exclude packages with `publish_to: "none"` (default: false)'
    required: false
    default: 'false'
  publish-dry-run:
    description: 'Whether packages should be dry-run published (default: false)'
    required: false
    default: 'false'
  tag:
    description: >-
      Whether packages should be tagged and pushed to the repository. Packages
      are tagged as `my_package-vX.Y.Z`, except for the root package of a
      workspace with `useRootAsPackage` enabled, which is tagged as `vX.Y.Z`.
      Workspaces with `command/version/workspaceTag` enabled are tagged with a
      single `vX.Y.Z` tag instead (default: false)
    required: false
    default: 'false'
  publish:
    description: 'Whether packages should be published to pub.dev (default: false)'
    required: false
    default: 'false'
  create-release:
    description: >-
      Whether a GitHub release should be created for the package related to the
      tag that triggered the workflow. The release notes are extracted from the
      package's CHANGELOG.md for the released version. When the tag is a
      workspace tag (`command/version/workspaceTag`), the release covers all
      packages in the workspace and the release notes are combined from the
      CHANGELOG.md of each package (default: false)
    required: false
    default: 'false'
  release-prerelease:
    description: >-
      Whether the created GitHub release should be marked as a prerelease. By
      default this is detected automatically from the version (any version
      containing a `-`, e.g. `1.2.3-dev.1`, is treated as a prerelease)
    required: false
    default: 'auto'
  create-pr:
    description: 'Whether a PR should be created with the versioning changes (default: false)'
    required: false
    default: 'false'
  pr-title:
    description: 'The title to use for the PR created when `create-pr` is true (default: "chore(release): Publish packages")'
    required: false
    default: 'chore(release): Publish packages'
  pr-body:
    description: 'The body to use for the PR created when `create-pr` is true (default: "Prepared all packages to be released to pub.dev")'
    required: false
    default: 'Prepared all packages to be released to pub.dev'
  close-existing-pr:
    description: >-
      Whether open release PRs previously created by this action should be
      closed, and their branches deleted, when a new PR is created with
      `create-pr` (default: true)
    required: false
    default: 'true'
  token:
    description: 'Token to use when creating the PR. Use a PAT or GitHub App token to trigger workflows on the created PR (default: GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  git-email:
    description: 'The email to use when committing changes'
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'
  git-name:
    description: 'The name to use when committing changes'
    required: false
    default: 'github-actions[bot]'
outputs:
  tags:
    description: >-
      The space separated tags that were created and pushed to the repository
      when `tag` is true
    value: ${{ steps.tag.outputs.tags }}
runs:
  using: composite
  steps:
    - name: 'Activate melos'
      run: dart pub global activate melos ${{ inputs.melos-version }}
      shell: bash
    - name: 'Run melos bootstrap'
      if: ${{ inputs.run-bootstrap == 'true' }}
      run: dart pub global run melos bootstrap ${{ inputs.enforce-lockfile == 'true' && '--enforce-lockfile' || '' }} ${{ inputs.bootstrap-no-example == 'true' && '--no-example' || '' }}
      shell: bash    
    - name: 'Add melos to PATH'
      run: command -v melos || echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      shell: bash
    - name: 'Set up git config for email and name'
      if: ${{ inputs.publish == 'true' || inputs.run-versioning == 'true' || inputs.run-versioning-prerelease == 'true' }}
      run: |
        git config --global user.email "${{ inputs.git-email }}"
        git config --global user.name "${{ inputs.git-name }}"
      shell: bash
    - name: 'Run melos version'
      if: ${{ inputs.run-versioning == 'true' }}
      run: melos version --yes --no-git-tag-version ${{ (inputs.include-private == 'true' && '--all') || '' }}
      shell: bash
    - name: 'Run melos version as a prerelease'
      if: ${{ inputs.run-versioning-prerelease == 'true' }}
      run: melos version --yes --no-git-tag-version --prerelease ${{ (inputs.include-private == 'true' && '--all') || '' }}
      shell: bash
    - name: 'Run melos version as and graduate prereleases'
      if: ${{ inputs.run-versioning-graduate == 'true' }}
      run: melos version --yes --no-git-tag-version --graduate ${{ (inputs.include-private == 'true' && '--all') || '' }}
      shell: bash
    - name: 'Run melos publish (dry run)'
      if: ${{ inputs.publish-dry-run == 'true' }}
      run: melos publish -y --dry-run
      shell: bash
    - name: 'Create Pull Request with changes'
      id: create-pr
      if: ${{ inputs.create-pr == 'true' }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ inputs.token }}
        title: ${{ inputs.pr-title }}
        body: ${{ inputs.pr-body }}
        branch: release-${{github.run_id}}
    - name: 'Close previous release Pull Requests'
      if: ${{ inputs.create-pr == 'true' && inputs.close-existing-pr == 'true' && steps.create-pr.outputs.pull-request-operation == 'created' }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        NEW_PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
      # Each run creates its PR from a `release-<run id>` branch, so any other
      # open PR from such a branch is a release PR from a previous run that is
      # superseded by the PR created in this run.
      run: |
        PREVIOUS_PRS=$(gh pr list --state open --limit 100 --json number,headRefName \
          --jq ".[] | select(.headRefName | test(\"^release-[0-9]+$\")) | select(.number != $NEW_PR_NUMBER) | .number")
        for pr in $PREVIOUS_PRS; do
          echo "Closing previous release PR #$pr"
          gh pr close "$pr" --delete-branch --comment "Superseded by #$NEW_PR_NUMBER."
        done
      shell: bash
    - name: 'Detect the tag format used by the workspace'
      if: ${{ inputs.tag == 'true' || inputs.publish == 'true' || inputs.create-release == 'true' }}
      # Workspaces versioned in lockstep with `command/version/workspaceTag`
      # enabled are tagged with a single plain version tag, e.g. `v1.2.3`, for
      # the whole workspace. The root package of workspaces with
      # `useRootAsPackage` enabled is also tagged with plain version tags, while
      # all other packages are tagged with tags prefixed with the package name,
      # e.g. `my_package-v1.2.3`.
      run: |
        if grep -Eq '^[[:space:]]+workspaceTag:[[:space:]]*true([[:space:]]+#.*)?[[:space:]]*$' pubspec.yaml 2>/dev/null; then
          WORKSPACE_TAG=true
        else
          WORKSPACE_TAG=false
        fi
        echo "WORKSPACE_TAG=$WORKSPACE_TAG" >> $GITHUB_ENV
        echo "Workspace tag: $WORKSPACE_TAG"
      shell: bash
    - name: 'Create and push tags to the repository'
      id: tag
      if: ${{ inputs.tag == 'true' }}
      run: |
        PACKAGES=$(melos list --json --relative ${{ inputs.include-private != 'true' && '--no-private' || '' }})
        if [ "$WORKSPACE_TAG" = "true" ]; then
          # All packages share the same version when versioned in lockstep, so
          # a single plain version tag is created for the whole workspace.
          VERSIONS=$(jq -r '[.[].version] | unique | .[]' <<< "$PACKAGES")
          if [ "$(jq '[.[].version] | unique | length' <<< "$PACKAGES")" -eq 1 ]; then
            TAGS="v$VERSIONS"
          else
            echo "::warning::Skipping tag creation since the packages have different versions ($(echo $VERSIONS)), while \"command/version/workspaceTag\" expects all packages to share the same version."
            TAGS=""
          fi
        else
          TAGS=$(jq -r '.[] | if .location == "." then "v\(.version)" else "\(.name)-v\(.version)" end' <<< "$PACKAGES")
        fi
        # We don't care about errors due to creating new tags (`|| true`)
        # since for all packages that didn't get a new release, the tag already exists.
        for tag in $TAGS; do git tag "$tag" || true; done
        # Push tags one by one to avoid github limitation on emitting new tag events
        git push --no-follow-tags
        PUSHED_TAGS=""
        for tag in $(git tag --points-at HEAD); do
          git push origin "$tag"
          PUSHED_TAGS="$PUSHED_TAGS $tag"
        done
        echo "tags=${PUSHED_TAGS# }" >> $GITHUB_OUTPUT
      shell: bash
    - name: 'Extract tag info'
      if: ${{ inputs.publish == 'true' || inputs.create-release == 'true' }}
      env:
        GITHUBREF: ${{ github.ref }}
      # Supports tags prefixed with the package name, e.g.
      # "refs/tags/my_package-v1.2.3+alpha.1", and plain version tags, e.g.
      # "refs/tags/v1.2.3+alpha.1". A plain version tag refers to the whole
      # workspace when `command/version/workspaceTag` is enabled and to the
      # root package otherwise (when `useRootAsPackage` is enabled).
      run: |
        TAG="${GITHUBREF#refs/tags/}"
        if [[ "$TAG" =~ ^([a-z0-9_]+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
          PACKAGE_NAME="${BASH_REMATCH[1]}"
          PACKAGE_VERSION="${BASH_REMATCH[2]}"
        elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
          PACKAGE_VERSION="${BASH_REMATCH[1]}"
          if [ "$WORKSPACE_TAG" = "true" ]; then
            # An empty package name refers to all packages in the workspace.
            PACKAGE_NAME=""
          else
            PACKAGE_NAME=$(melos list --json --relative | jq -r '.[] | select(.location == ".") | .name')
            if [ -z "$PACKAGE_NAME" ]; then
              echo "::error::The tag \"$TAG\" is a plain version tag, but neither \"command/version/workspaceTag\" nor \"useRootAsPackage\" is enabled in the workspace."
              exit 1
            fi
          fi
        else
          echo "::error::The tag \"$TAG\" is neither on the \"my_package-vX.Y.Z\" nor on the \"vX.Y.Z\" format."
          exit 1
        fi
        if [ -n "$PACKAGE_NAME" ]; then
          RELEASE_NAME="$PACKAGE_NAME v$PACKAGE_VERSION"
        else
          RELEASE_NAME="v$PACKAGE_VERSION"
        fi
        echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
        echo "Package name: ${PACKAGE_NAME:-<all packages in the workspace>}"
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
        echo "Package version: $PACKAGE_VERSION"
        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
      shell: bash
    - name: 'Installs the Dart SDK and sets up the pipeline for usage with pub.dev (this sets up OIDC)'
      if: ${{ inputs.publish == 'true' && inputs.dart-version != 'none' }}
      uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
      with:
        sdk: ${{ inputs.dart-version }}
    - name: 'Publish package related to tag to pub.dev'
      if: ${{ inputs.publish == 'true' }}
      # All packages are published when the tag refers to the whole workspace.
      run: melos publish -y --no-dry-run ${PACKAGE_NAME:+--scope=$PACKAGE_NAME}
      shell: bash
    - name: 'Extract changelog for the release'
      if: ${{ inputs.create-release == 'true' }}
      # Read the section for $PACKAGE_VERSION out of the CHANGELOG.md of each
      # package in the release. The section starts at the "## <version>" header
      # and ends at the next "## " header (or the end of the file). The version
      # is matched exactly against the header's version token so "1.2.3" does
      # not match "1.2.30". When the release covers the whole workspace, the
      # sections of all packages are combined under a "## <package name>"
      # header each.
      run: |
        if [ -n "$PACKAGE_NAME" ]; then
          RELEASE_PACKAGES=$(melos list --json | jq -c "[.[] | select(.name == \"$PACKAGE_NAME\")]")
        else
          RELEASE_PACKAGES=$(melos list --json ${{ inputs.include-private != 'true' && '--no-private' || '' }} | jq -c "[.[] | select(.version == \"$PACKAGE_VERSION\")]")
        fi
        CHANGELOG_CONTENT=""
        PUBLISHED_PACKAGES=""
        while IFS=$'\t' read -r NAME LOCATION PRIVATE; do
          CHANGELOG_PATH="$LOCATION/CHANGELOG.md"
          if [ -f "$CHANGELOG_PATH" ]; then
            SECTION=$(awk -v ver="$PACKAGE_VERSION" '/^## /{flag=($2==ver); next} flag' "$CHANGELOG_PATH")
          else
            echo "No CHANGELOG.md found at $CHANGELOG_PATH, creating release without notes for $NAME."
            SECTION=""
          fi
          if [ -n "$PACKAGE_NAME" ]; then
            CHANGELOG_CONTENT="$SECTION"
          else
            CHANGELOG_CONTENT="${CHANGELOG_CONTENT:+$CHANGELOG_CONTENT$'\n\n'}## $NAME"$'\n'"$SECTION"
          fi
          if [ "$PRIVATE" != "true" ]; then
            PUBLISHED_PACKAGES="$PUBLISHED_PACKAGES $NAME"
          fi
        done < <(jq -r '.[] | "\(.name)\t\(.location)\t\(.private)"' <<< "$RELEASE_PACKAGES")
        # Detect prerelease from the version, ignoring "+build" metadata (which
        # may itself contain a "-"). A "-" in the version core marks a prerelease.
        if [ "${{ inputs.release-prerelease }}" = "auto" ]; then
          case "${PACKAGE_VERSION%%+*}" in
            *-*) IS_PRERELEASE=true ;;
            *) IS_PRERELEASE=false ;;
          esac
        else
          IS_PRERELEASE="${{ inputs.release-prerelease }}"
        fi
        echo "RELEASE_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
        {
          echo "RELEASE_BODY<<MELOS_RELEASE_EOF"
          echo "$CHANGELOG_CONTENT"
          if [ "${{ inputs.publish }}" = "true" ] && [ -n "$PUBLISHED_PACKAGES" ]; then
            echo ""
            echo "---"
            for package in $PUBLISHED_PACKAGES; do
              echo "Published to pub.dev: https://pub.dev/packages/$package/versions/$PACKAGE_VERSION"
            done
          fi
          echo "MELOS_RELEASE_EOF"
        } >> $GITHUB_ENV
      shell: bash
    - name: 'Create GitHub release'
      if: ${{ inputs.create-release == 'true' }}
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        token: ${{ inputs.token }}
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_NAME }}
        body: ${{ env.RELEASE_BODY }}
        prerelease: ${{ env.RELEASE_PRERELEASE }}
